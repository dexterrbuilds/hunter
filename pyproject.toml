[project]
name = "hunter"
version = "2.0"
description = "Independently maintained Pump.fun and LetsBonk trading bot"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "base58>=2.1.1",
    "construct>=2.10.67",
    "solana==0.36.6",
    "solders>=0.26.0",
    "websockets>=15.0",
    "python-dotenv>=1.2.2",
    "aiohttp>=3.14.3",
    "grpcio>=1.71.0",
    "protobuf>=5.29.4",
    "pyyaml>=6.0.2",
    "uvloop>=0.21.0; sys_platform != 'win32'",
    "winloop>=0.1.0; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "ruff>=0.10.0",
    # protoc; only needed to regenerate src/geyser/generated from src/geyser/proto
    "grpcio-tools>=1.71.0",
]

[project.scripts]
hunter = "bot_runner:main"
hunter-benchmark-report = "benchmark.report:main"
hunter-benchmark-live = "benchmark.cli:live_main"
hunter-benchmark-detection = "benchmark.cli:detection_main"
hunter-benchmark-transport = "benchmark.cli:transport_main"
hunter-live-benchmark-report = "benchmark.cli:report_main"

[tool.setuptools]
py-modules = ["bot_runner", "config_loader"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "N", "B", "A", "C4", "T10", "ARG", "PTH",
    "ANN",  # type annotations
    "S",    # security best practices
    "BLE",  # blind except statements
    "FBT",  # boolean trap parameters
    "C90",  # complexity metrics
    "TRY",  # exception handling best practices
    "SLF",  # private member access
    "TCH",  # type checking issues
    "RUF",  # Ruff-specific rules
    "ERA",  # eradicate commented-out code
    "PL",   # pylint conventions
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",
    "ARG",
    "PLR2004",
    "S101",
    "S404",
    "S603",
    "S607",
    "SLF001",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
